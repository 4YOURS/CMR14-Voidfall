# Подсказки для ксенонидов
  - 'Кислотную ловушку можно незаметно установить рядом с дверью и застать морпехов врасплох.'
  - 'Сооружения ксенонидов — скопления, стены и столбы — жизненно важны для победы: они служат укрытиями, задерживают морпехов и направляют их в нужные проходы.'
  - 'Всегда благодарите дронов и Владык улья за поддержку!'
  - 'Не недооценивайте выживших. У них нет брони, поэтому они очень быстры, от природы крепче морпехов и располагают множеством хитростей.'
  - 'Пока Королева не находится на яйцекладе, улей не получает очки эволюции.'
  - 'Пробуйте новые касты и штаммы, которые раньше обходили стороной. Некоторые из них могут оказаться неожиданно интересными.'
  - 'Не стоит прыгать или бросаться на морпеха у самого края экрана: рядом с ним может находиться боец с дробовиком.'
  - 'Большинство ксенонидов погибает из-за чрезмерной агрессии, особенно вне сорняков. Сдерживайтесь, иначе будете умирать раунд за раундом.'
  - 'Плюньте или выстрелите в бак со сварочным топливом, чтобы взорвать его рядом с противниками.'
  - 'Если рядом вот-вот взорвётся заряд, быстро лягте: вы получите вдвое меньше урона от взрыва. Так же можно избежать части шрапнели от некоторых взрывов.'
  - 'Обесточенные ставни можно открыть вручную щелчком. Королева также способна открыть герметичные ставни, но ей потребуется время.'
  #- 'Перемещение по трубам создаёт шум, а вход и выход из вентиляции сопровождаются заметными визуальными и звуковыми эффектами.'
  - 'Если союзного ксенонида оглушили, оттащите его в безопасное место.'
  #- 'Неистовство увеличивает скорость и урон, Восстановление ускоряет регенерацию здоровья, а Защита продлевает время до смерти в критическом состоянии.'
  - 'Ксенонид может полностью отключить ночное зрение. Это помогает понять, насколько хорошо ваша позиция скрыта от морпехов на экране.'
  #- 'Разорванные тела можно пожирать, чтобы удобнее переносить их к бассейну возрождения или преобразователю яиц.'
  - 'Чем крупнее ксенонид, тем дольше он входит в тоннель.'
  #- 'Ксенонид среднего или меньшего размера может пройти через отверстие в стене, перетащив себя на него.'
  - 'Мины «Клеймор» имеют направленный взрыв. Активируйте их заранее ударом с обратной стороны.'
  - 'Если вам трудно попадать щелчком по морпехам, попробуйте направленный удар. Для способностей направленного удара нет.'
  #- 'Луркер или Бегун может по диагонали перепрыгивать через углы огня, не воспламеняясь.'
  #- 'Ксенонид может разбить очки ночного видения на шлеме морпеха. Цельтесь в голову и атакуйте, пока очки не разрушатся.'
  #- 'Прыжки неэффективны против лежащих морпехов.'
  - 'Прыжок на пристёгнутого к стулу человека оглушит его, но не собьёт на пол.'
  - 'Порошок от звёздных снарядов плавится так же, как обычные фальшфейеры.'
  - 'Управляемый Паразит может после подготовки прыгнуть на цель. Заражение произойдёт только при приземлении вплотную к ней; иначе цель будет лишь ненадолго сбита с ног.'
  - 'Играя за Паразита, можно открыть состояние улья и наблюдать за сёстрами. Это помогает находить других Паразитов, фланговые касты и учиться у опытных игроков.'
  - 'Способности Равагера значительно усиливаются, если применить усиление рядом как минимум с тремя людьми.'

# Общие игровые подсказки
  - 'Не злитесь из-за смерти. Все пришли сюда хорошо провести время.'
  - 'После смерти подумайте, какую ошибку совершили, и постарайтесь не повторять её.'
  - 'Связь между морпехами, дроном и Королевой или командованием и всем составом жизненно важна. Своевременное сообщение о фланге может изменить весь ход раунда.'
  - 'Играя за ксенонида или морпеха, следите за флангами независимо от того, успешно ли идёт наступление или остановилось.'
  - 'Половина мастерства — знать, когда нужно действовать агрессивно. Вторая половина — знать, когда этого делать не следует.'
