# Подсказки для морпехов
  - 'Пилоты: в начале раунда в ангаре находится по одному улучшению каждого типа для двигателей, поэтому не нужно тратить очки на печать полного комплекта.'
  - 'Во второй слот уха можно положить отвёртку, сигареты и некоторые другие небольшие предметы!'
  - 'Нажав правой кнопкой мыши на хранилище, можно изменить действие при щелчке по нему, например настроить пояс на выдачу магазина.'
  - 'Можно доставать предметы из хранилищ второго уровня, например бинт из аптечки, лежащей внутри сумки.'
  - 'СЛР продлевает время, в течение которого погибшего морпеха можно оживить дефибриллятором. Нажимайте по телу пустой рукой и соблюдайте правильный ритм!'
  - 'Огнемёты: зелёное пламя наносит мало урона, но полезно для плавления брони и мгновенно тушится. Королева и Равагер невосприимчивы к огню. Основной урон огнемёта наносит первоначальная струя, а не пламя на земле. Не забывайте о подствольном огнетушителе.'
  - 'В шлеме можно носить разные небольшие предметы: от марли и сигарет до фальшфейеров и отвёрток.'
  - 'Количество предметов в снабжении и комнатах подготовки отрядов зависит от числа игроков, отметившихся готовыми в начале раунда.'
  - 'Офицеры и командир обучены работе с погрузочным экзоскелетом и инженерному делу, поэтому могут заряжать орбитальное орудие.'
  - 'Неправильно заряженный орбитальный снаряд может сильно отклониться от выбранной цели. Проверяйте порядок зарядки!'
  - 'Спасательная капсула рассчитана только на троих. При большем числе пассажиров или наличии крупного ксенонида она выйдет из строя и взорвётся при запуске.'
  - 'Голокарты помогают врачам и медикам проводить сортировку раненых. Назначайте их морпехам с травмами, которые нельзя вылечить без операции: осмотрите бойца через Shift + щелчок и выберите подходящую голокарту.'
  - 'Медицинский отдел может изготавливать герметичные подсумки для канистр, вмещающие большой объём реагентов и пользовательские инъекторы.'
  - 'Смоляные сооружения хуже защищены от оружия ближнего боя, чем от пуль. Доставайте ножи!'
  - 'Штык или метательный нож можно закрепить в слоте маски.'
  - 'Если на оружии установлен штык, им можно вручную вскрывать обесточенные двери, нажимая на дверь оружием. Повторный щелчок закроет её.'
  - 'Если другой морпех оглушён, нажмите по нему пустой рукой, чтобы быстрее привести его в чувство.'
  - 'Орбитальный обстрел всегда ближе, чем кажется.'
  - 'Меняйте снаряжение! Один и тот же набор быстро надоедает. Попробуйте пистолеты или возьмите с собой фальшфейеры.'
  - 'Боеголовки орбитального обстрела учитывают крышу и защиту ядра улья. В защищённые зоны они не попадают.'
  - 'ARES периодически сообщает количество доступных технологических очков по командному каналу.'
  - 'Нажатие на трекер командира отряда переключает отслеживание на командира вашей огневой группы.'
  - 'Если ксенонид сбил вас прыжком, а отряд уже ведёт по нему огонь, используйте действие отдыха и оставайтесь лежать, чтобы после подъёма не попасть под дружественный огонь.'
  - 'Бронебойные боеприпасы наносят меньше урона целям без брони.'
  - 'Подрывные заряды можно получить в снабжении или автомате инженера отряда. Они похожи на C4, но устанавливаются и взрываются быстрее, а с противоположной стороны выбрасывают мощную шрапнель. Для применения нужны базовые инженерные навыки, которые можно получить из учебной брошюры.'
  - 'Чтобы проверить свои навыки, осмотрите себя и нажмите значок фуражки.'
  - 'Выстрел в упор, или PB, выполняется прямым щелчком оружием по существу рядом с вами. На такой выстрел не влияет точность, поэтому дробовик и другое оружие особенно эффективны на близкой дистанции.'
  - 'Индикатор зоны на карте показывает, в какой области вы находитесь.'
  - 'Баррикады можно ремонтировать сварочным аппаратом.'
  - 'При входе в комнату или узкий проход сразу отходите в сторону, чтобы следующие бойцы могли войти и открыть огонь.'
  - 'Загнанный в угол ксенонид — мёртвый ксенонид.'
  - 'Один ксенонид почти всегда победит одинокого морпеха.'
  - 'Если никто не увидит вашу смерть, никто не придёт на помощь. По возможности никогда не ходите в одиночку.'
  - 'Не стойте на месте рядом с активной линией фронта. Неподвижную цель легко схватит Воин, собьёт Прыгун или Бегун, притянет Угнетатель либо поразит кислота.'
  - 'Помните: если вы ничего не видите, рядом находится Луркер. Если нет прямой видимости — там Луркер. Если баррикада открыта — через неё уже прошёл Луркер.'
  - 'Свет и обзор жизненно важны для успеха, но одновременно являются вашей главной уязвимостью.'
  - 'Для правильной стрельбы большинство оружия нужно держать двумя руками. При стрельбе одной рукой резко снижаются точность и контроль отдачи, а разброс увеличивается. Чтобы взять винтовку двумя руками, нажмите на неё в активной руке клавишей Z.'
  - 'Длинный звуковой сигнал обычно означает, что у вас закончились боеприпасы.'
  - 'Берите складные носилки, чтобы эвакуировать потерявших сознание морпехов с передовой.'
  - 'Стройте баррикады глубже внутрь позиции, чтобы увеличить пространство для стрельбы и размер зоны поражения.'
  - 'При установке баррикад оставляйте морпехам место для позиции в одной клетке позади них.'
  - 'Гораздо безопаснее построить баррикады в тылу, а затем передвинуть их на передовую.'
  - 'Огромная передовая база нужна не всегда!'
  - 'Расходуйте материалы разумно: металл и пласталь дороги.'
  - 'Чтобы попросить морпеха отойти, укажите на него сочетанием Shift + средняя кнопка мыши и попросите освободить путь. Если отстали — догоняйте и просите отряд подождать; если ушли вперёд — ждите остальных.'
  - 'Следите за позициями и линиями огня союзников. Не заходите под их огонь и прекращайте стрельбу, если кто-то пересекает вашу линию.'
  - 'Не позволяйте взять себя в плен! Лучше погибнуть в бою: пленённый морпех станет новым яйцом для ксенонидов.'
  - 'Ксенониды могут поглощать морпехов без сознания и переносить их в улей, перетаскивая тело на себя.'
  - 'Не стойте вплотную к баррикаде: ксенонид может ударить вас через неё.'
  - 'Одинокий морпех — мёртвый морпех и счастливый ксенонид. Держитесь вместе!'
  - 'Всегда укрепляйте баррикады колючей проволокой.'
  - 'Через ограждения можно перелезать.'
  - 'Остерегайтесь дружественного огня. Не заходите на чужую линию стрельбы и следите, чтобы никто не оказался на вашей.'
  - 'Будьте осторожны с ручными гранатами. Если после активации вас оглушат или собьют с ног, граната упадёт рядом с вами и подвергнет опасности весь отряд.'
  - 'Осматривайте окончательно погибших морпехов со значком черепа в медицинском интерфейсе: у них могут остаться разгрузки, бронебойные боеприпасы или бинокли. Не забирайте вещи у тех, кого ещё можно оживить.'
  - 'Всегда проверяйте пространство под незакреплёнными предметами на наличие ловушек — это может спасти вам жизнь.'
  - 'Берите огнетушитель: он может спасти чью-то жизнь, убрать мешающее продвижению пламя, смыть кислоту с морпехов и потушить горящих людей.'
  - 'Обменять свою жизнь на жизнь ксенонида почти всегда выгодно.'
  - 'Ни один раунд ещё не был выигран за баррикадой. Кроме тех, которые были.'
  - 'По мере продвижения уничтожайте сорняки и сооружения ксенонидов.'
  - 'При работе с огнемётом не перекрывайте путь наступающим союзникам.'
  - 'По возможности эвакуируйте тела. Даже если морпеха нельзя оживить, с него можно снять полезное снаряжение и боеприпасы.'
  - 'Нехватка припасов на передовой базе может стоить вам раунда. Распаковывайте ящики, оружие и боеприпасы для других морпехов.'
  - 'Больше дакки не помогает, когда она направлена в ваших товарищей.'
  - 'Передовая база прочна настолько, насколько прочно её самое слабое место. Защищайте все фланги и помните, что стены можно вскрыть.'
  - 'Если основное наступление остановилось, а зона переполнена, скоординируйтесь с несколькими бойцами и попробуйте атаковать с другого направления.'
  - 'При продвижении проверяйте фланги, особенно в пещерах.'
  - 'Забирать модули и другие полезные вещи у погибших морпехов допустимо, но сначала убедитесь, что они действительно мертвы.'
  - 'Получив сброшенный снабжением ящик, отодвиньте его перед открытием. Иначе следующие ящики могут оказаться скрыты под ним.'
  - 'Ручным этикетировщиком из комнаты подготовки отряда можно подписать снаряжение, снизив вероятность его кражи.'
  - 'Персонал CIC может отслеживать всех союзных морпехам существ через консоль датчиков костюмов и консоль наблюдения. Это помогает находить сбежавших заключённых и погибших бойцов.'
  - 'Чтобы убрать дефибриллятор в хранилище, сначала сложите его электроды.'
  - 'У бойцов ЧВК Вейланд-Ютани нет морпеховского IFF. Не стреляйте по ним из смартганов!'
  - 'Чтобы говорить сразу по нескольким радиоканалам, после двоеточия укажите до четырёх префиксов. Например, :abcd передаёт сообщение одновременно по четырём основным каналам отрядов.'
  - 'Среди вооружения авиационной поддержки мини-ракеты дают наибольшую мощность за свою стоимость.'
  - 'Подствольный дробовик мгновенно разрушает смоляные двери и механические шлюзы, а также неплохо справляется со стенами.'
  - 'Снабжение может отказать в обслуживании пижамарину — морпеху в одежде для криосна. Не забывайте надевать форму.'
  - 'Не недооценивайте миномёт: при наличии боеприпасов и хорошей связи он способен нанести огромный урон.'
  - 'Через палатки можно стрелять, но от ответного огня они почти не защищают.'
  - 'Бюджет снабжения не бесконечен.'
  - 'Хорошее снабжение способно доставить припасы почти в любую открытую точку по координатам, иногда за очень короткое время.'
